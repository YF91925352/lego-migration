name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and end-to-end tests
        run: pytest -q
      - name: Smoke run of the whole pipeline on the fixture data
        run: |
          python -m legomig export  --raw tests/fixtures/raw --out /tmp/ci --defects 1
          python -m legomig migrate --out /tmp/ci
          python -m legomig migrate --out /tmp/ci   # second run must skip every stage
          python -m legomig verify  --out /tmp/ci --reports /tmp/ci/reports
          python -m legomig query   --out /tmp/ci --reports /tmp/ci/reports
